[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromalint"
version = "0.1.0"
description = "A linter for CSS colour literals: hex, rgb(), hsl(), and friends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crate-shale" }]

[project.scripts]
chromalint = "chromalint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
